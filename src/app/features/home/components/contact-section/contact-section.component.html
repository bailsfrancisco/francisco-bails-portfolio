<section id="contact" class="contact-section">
  <div class="contact-container">

    <span class="section-eyebrow">
      {{ i18n.translate('contact.eyebrow') }}
    </span>

    <h2>
      {{ i18n.translate('contact.title') }}
      <span class="highlight">
        {{ i18n.translate('contact.titleHighlight') }}
      </span>
    </h2>

    <p class="contact-description">
      {{ i18n.translate('contact.description') }}
    </p>

    <a class="contact-button" [href]="'mailto:' + email">
      <span>{{ i18n.translate('contact.button') }}</span>
      <span class="button-arrow" aria-hidden="true">↗</span>
    </a>

    <div class="contact-email">
      <span>{{ i18n.translate('contact.emailLabel') }}</span>
      <a [href]="'mailto:' + email">{{ email }}</a>
    </div>

    <div class="contact-socials">

      <a [href]="linkedinUrl" target="_blank" rel="noopener noreferrer"
        [attr.aria-label]="i18n.translate('contact.linkedinLabel')">

        <i class="bi bi-linkedin" aria-hidden="true"></i>
        <span>LinkedIn</span>
      </a>

      <a [href]="githubUrl" target="_blank" rel="noopener noreferrer"
        [attr.aria-label]="i18n.translate('contact.githubLabel')">

        <i class="bi bi-github" aria-hidden="true"></i>
        <span>GitHub</span>
      </a>

    </div>

  </div>
</section>
